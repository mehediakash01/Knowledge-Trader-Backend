databases:
  - name: knowledge-trader-db
    plan: free
    databaseName: knowledge_trader
    user: knowledge_trader_user

services:
  - type: redis
    name: knowledge-trader-redis
    plan: free
    ipAllowList: [] # Required by Render. Empty list means only internal Render services can access it.

  - type: web
    name: knowledge-trader-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CORS_ORIGIN
        value: "https://your-frontend-domain.vercel.app" # Must be a real domain, wildcard '*' fails with credentials:true
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-trader-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: knowledge-trader-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
